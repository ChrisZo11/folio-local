[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "folio-local"
version = "0.1.0"
description = "A private, local-first investment portfolio and MCP server"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "yfinance>=0.2.65,<1",
  "mcp>=1.12,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
folio = "portfolio.cli:main"

[tool.setuptools.packages.find]
include = ["portfolio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
